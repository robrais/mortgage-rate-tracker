databases:
  - name: mortgage-tracker-db
    plan: free
    databaseName: mortgage_tracker
    user: mortgage_user

services:
  - type: web
    name: mortgage-tracker
    runtime: node
    rootDir: ./backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: JWT_SECRET
        generateValue: true
      - key: MORTGAGE_API_URL
        value: https://api.api-ninjas.com/v1/mortgagerate
      - key: MORTGAGE_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: mortgage-tracker-db
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
