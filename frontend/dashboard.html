<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Mortgage Rate Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🏠 Mortgage Rate Tracker</h1>
      <div class="user-info">
        <span id="user-email"></span>
        <button id="logout-btn" class="btn btn-secondary">Logout</button>
      </div>
    </header>

    <!-- Current Rates Section -->
    <section class="rates-section">
      <h2>Current Mortgage Rates</h2>
      <div id="current-rates" class="rates-grid">
        <div class="rate-card loading">Loading rates...</div>
      </div>
    </section>

    <!-- Create Alert Section -->
    <section class="alert-section">
      <h2>Create Rate Alert</h2>
      <form id="alert-form" class="alert-form">
        <div class="form-row">
          <div class="form-group">
            <label for="mortgage-type">Mortgage Type:</label>
            <select id="mortgage-type" required>
              <option value="30_YEAR_FIXED">30 Year Fixed</option>
              <option value="15_YEAR_FIXED">15 Year Fixed</option>
            </select>
          </div>
          <div class="form-group">
            <label for="target-rate">Target Rate (%):</label>
            <input type="number" id="target-rate" step="0.001" min="0" max="20" required>
          </div>
          <button type="submit" class="btn btn-primary">Create Alert</button>
        </div>
        <div id="alert-error" class="error-message"></div>
      </form>
    </section>

    <!-- My Alerts Section -->
    <section class="alerts-list-section">
      <h2>My Rate Alerts</h2>
      <div id="alerts-list" class="alerts-list">
        <p class="loading">Loading alerts...</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
